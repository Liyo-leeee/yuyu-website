<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="天猫竞店商品详情参数监控">
  <title>天猫竞店参数监控</title>
  <style>
    :root{--ink:#142033;--muted:#6b7280;--line:#d9e0ea;--blue:#123c70;--blue2:#1e5c98;--bg:#f4f6f9;--card:#fff;--orange:#e87518;--green:#147a4b;--red:#b93737}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    a{color:var(--blue2)}button,input,select{font:inherit}.shell{max-width:1680px;margin:auto;padding:0 22px 48px}
    .hero{background:linear-gradient(118deg,var(--blue),#1b5791);color:#fff;margin:0 -22px 20px;padding:27px max(22px,calc((100vw - 1680px)/2 + 22px));box-shadow:0 5px 18px #0b2f701f}
    .hero-row{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}.hero h1{margin:0;font-size:30px}.hero p{margin:7px 0 0;color:#dce9f8}.hero-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hero-actions select{min-height:38px;border:0;border-radius:7px;padding:7px 10px;color:var(--ink)}
    .hero-actions a,.hero-actions button{background:#fff;color:var(--blue);border:0;border-radius:7px;padding:9px 12px;text-decoration:none;cursor:pointer}.hero-actions button{cursor:pointer}
    .layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px #12223a0b}.sidebar{padding:13px;align-self:start;position:sticky;top:12px}.sidebar h2{font-size:15px;margin:4px 8px 10px}.store-list{display:flex;flex-direction:column;gap:4px}.store-btn{border:1px solid transparent;background:transparent;text-align:left;padding:9px 10px;border-radius:7px;cursor:pointer;color:var(--ink)}.store-btn:hover{background:#eef4fb}.store-btn.active{background:#e8f1fb;border-color:#b8cde7;color:var(--blue);font-weight:650}.store-count{display:block;color:var(--muted);font-size:11px;margin-top:2px;font-weight:400}.main{min-width:0}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.toolbar .search{flex:1 1 280px}.toolbar input{min-height:40px;border:1px solid var(--line);border-radius:7px;padding:8px 11px;width:100%;background:#fff}.toolbar-actions{display:flex;gap:7px;flex-wrap:wrap}.toolbar-actions button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 11px;cursor:pointer;color:var(--blue)}.toolbar-actions button:hover{border-color:#8caed3;background:#f4f8fc}
    .stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{padding:14px 15px}.stat-label{color:var(--muted);font-size:12px}.stat-value{color:var(--blue);font-size:25px;font-weight:750;margin-top:2px}.stat-note{color:var(--muted);font-size:11px;margin-top:2px}
    .table-panel{padding:13px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.data-table{width:100%;border-collapse:collapse;min-width:1780px}.data-table th{position:sticky;top:0;background:var(--blue);color:#fff;text-align:left;padding:10px 9px;font-size:12px;white-space:nowrap}.data-table td{padding:9px;border-bottom:1px solid #edf0f4;vertical-align:top;font-size:12px}.data-table tr:hover td{background:#f8fbff}.thumb{width:60px;height:60px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#fafafa}.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}.title{min-width:270px;max-width:360px}.param{max-width:170px;word-break:break-all}.tag{display:inline-block;padding:2px 6px;background:#eef4fb;color:var(--blue);border-radius:999px;white-space:nowrap}.covered{color:var(--green);font-weight:650}.pending{color:var(--muted)}.price{white-space:nowrap;font-variant-numeric:tabular-nums}.sales{color:var(--red);white-space:nowrap}.detail-box summary{cursor:pointer;color:var(--blue2);white-space:nowrap}.detail-box dl{display:grid;grid-template-columns:90px minmax(130px,1fr);gap:3px 8px;min-width:290px;margin:8px 0}.detail-box dt{color:var(--muted)}.detail-box dd{margin:0;word-break:break-all}.raw{white-space:pre-wrap;max-width:380px;color:#4b5563;margin-top:8px}.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:13px 0 1px}.pager button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 10px;cursor:pointer}.pager button:disabled{opacity:.45;cursor:not-allowed}.page-text{min-width:118px;text-align:center;color:var(--muted)}.notice{margin:0 0 14px;padding:11px 13px;background:#fff8ed;border-left:3px solid var(--orange);color:#7a4b1c;border-radius:5px;font-size:12px}.empty{padding:45px 12px;text-align:center;color:var(--muted)}
    @media(max-width:1050px){.layout{grid-template-columns:1fr}.sidebar{position:static}.store-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:650px){.shell{padding:0 11px 32px}.hero{margin:0 -11px 14px;padding:21px 11px}.hero h1{font-size:24px}.store-list{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-value{font-size:21px}.toolbar-actions{width:100%}.toolbar-actions button{flex:1}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="hero-row">
        <div><h1>天猫竞店参数监控</h1><p>商品详情页“参数信息”逐商品记录，店铺独立分类，支持下载整理</p></div>
        <div class="hero-actions"><select id="store-select" aria-label="选择店铺"></select><button id="download-csv" type="button">下载当前 CSV</button><button id="download-json" type="button">下载当前 JSON</button><a href="../tommy-tmall-public-dashboard-upload/" target="_blank" rel="noopener">Tommy 原监控</a></div>
      </div>
    </header>
    <div class="layout">
      <aside class="panel sidebar"><h2>店铺分类</h2><div id="store-list" class="store-list"></div></aside>
      <main class="main">
        <div class="notice">当前数据只表示抓取时点能看到的公开详情。遇到登录失效、验证码或机器人预警会暂停；“待详情检查”不是页面没有该参数。</div>
        <section class="stats">
          <article class="panel stat"><div class="stat-label">当前店铺商品</div><div class="stat-value" id="stat-products">0</div><div class="stat-note">按商品 ID 去重</div></article>
          <article class="panel stat"><div class="stat-label">详情已检查</div><div class="stat-value" id="stat-details">0</div><div class="stat-note">已成功读取参数区域</div></article>
          <article class="panel stat"><div class="stat-label">参数有内容</div><div class="stat-value" id="stat-params">0</div><div class="stat-note">至少解析到 1 个键值</div></article>
          <article class="panel stat"><div class="stat-label">主图已记录</div><div class="stat-value" id="stat-images">0</div><div class="stat-note">详情页可见主图 URL</div></article>
          <article class="panel stat"><div class="stat-label">大致品类</div><div class="stat-value" id="stat-categories">0</div><div class="stat-note">按标题/详情参数保守归类</div></article>
          <article class="panel stat"><div class="stat-label">最近快照</div><div class="stat-value" id="stat-date">-</div><div class="stat-note" id="stat-updated">尚未抓取</div></article>
        </section>
        <section class="panel table-panel">
          <div class="toolbar"><div class="search"><input id="search" type="search" placeholder="搜索标题、商品 ID、品牌、货号、材质或颜色"></div><select id="category-filter" aria-label="按大致品类筛选"><option value="">全部大致品类</option></select><div class="toolbar-actions"><button id="download-index" type="button">下载店铺索引</button><button id="reset" type="button">重置筛选</button></div></div>
          <div id="result-note" class="subtle"></div>
          <div class="table-wrap"><table class="data-table"><thead><tr><th>商品 ID</th><th>主图</th><th>商品标题</th><th>大致分类</th><th>列表价</th><th>列表销量</th><th>品牌</th><th>货号</th><th>材质/成分</th><th>上市年份季节</th><th>适用人群</th><th>适用场景</th><th>商场同款</th><th>版型/衣长</th><th>尺码</th><th>颜色</th><th>全部参数</th><th>详情</th></tr></thead><tbody id="product-body"></tbody></table></div>
          <div class="pager"><button id="prev" type="button">上一页</button><span id="page-text" class="page-text"></span><button id="next" type="button">下一页</button></div>
        </section>
      </main>
    </div>
  </div>
  <script>
    const state={manifest:null,store:null,items:[],filtered:[],page:1,pageSize:40};
    const $=id=>document.getElementById(id);
    const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const integer=value=>Number(value||0).toLocaleString('zh-CN');
    const formatDate=value=>value?String(value).replace('T',' ').slice(0,16):'-';
    const params=item=>item.parameters||{};
    const pick=(item,keys)=>{const p=params(item);for(const key of keys){if(p[key])return p[key]}return ''};
    const allParamsText=item=>Object.entries(params(item)).map(([key,value])=>key+'：'+value).join('；')||item.parameter_text||'';
    const searchText=item=>[item.id,item.title,item.category,item.sales_display,item.detail_status,allParamsText(item)].join(' ').toLowerCase();
    function renderStoreControls(){const stores=state.manifest.stores; $('store-select').innerHTML=stores.map(s=>'<option value="'+escapeHtml(s.slug)+'">'+escapeHtml(s.name)+'</option>').join(''); $('store-list').innerHTML=stores.map(s=>'<button class="store-btn" data-store="'+escapeHtml(s.slug)+'">'+escapeHtml(s.name)+'<span class="store-count">'+integer(s.productCount)+' 个商品 · '+integer(s.categoryCount||0)+' 类 · '+(s.snapshotDate||'待抓取')+'</span></button>').join(''); document.querySelectorAll('.store-btn').forEach(btn=>btn.addEventListener('click',()=>loadStore(btn.dataset.store))); }
    async function loadStore(slug){const meta=state.manifest.stores.find(s=>s.slug===slug)||state.manifest.stores[0]; if(!meta)return; state.store=meta; state.page=1; $('store-select').value=meta.slug; document.querySelectorAll('.store-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.store===meta.slug)); const response=await fetch('./data/'+encodeURIComponent(meta.slug)+'.json'); const data=await response.json(); state.items=data.items||[]; render(); }
    function updateStats(){const items=state.items.filter(x=>x.active!==false); $('stat-products').textContent=integer(items.length); $('stat-details').textContent=integer(items.filter(x=>x.detail_status==='已抓取参数').length); $('stat-params').textContent=integer(items.filter(x=>Object.keys(params(x)).length).length); $('stat-images').textContent=integer(items.filter(x=>x.main_image_url||(x.main_image_urls||[]).length).length); $('stat-categories').textContent=integer(new Set(items.map(x=>x.category||'其他')).size); $('stat-date').textContent=state.store?.snapshotDate||'-'; $('stat-updated').textContent=state.store?.updatedAt?'更新于 '+formatDate(state.store.updatedAt):'尚未抓取'; }
    function detailsHtml(item){const entries=Object.entries(params(item)); if(!entries.length && !item.parameter_text)return '<span class="pending">待详情检查</span>'; const dl=entries.map(([key,value])=>'<dt>'+escapeHtml(key)+'</dt><dd>'+escapeHtml(value)+'</dd>').join(''); const raw=item.parameter_text&&entries.length?'<div class="raw">'+escapeHtml(item.parameter_text)+'</div>':''; return '<details class="detail-box"><summary>查看 '+integer(entries.length)+' 项</summary><dl>'+dl+'</dl>'+raw+'</details>'; }
    function imageHtml(item){const url=item.main_image_url||(item.main_image_urls||[])[0]; return url?'<a href="'+escapeHtml(url)+'" target="_blank" rel="noopener"><img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="'+escapeHtml(url)+'" alt="'+escapeHtml(item.title||'商品主图')+'"></a>':'<span class="pending">待补图</span>'; }
    function valueHtml(value,item){return value?escapeHtml(value):'<span class="pending">'+(item.detail_status==='已抓取参数'?'页面未显示':'待抓取')+'</span>'; }
    function render(){const q=$('search').value.trim().toLowerCase(); const selectedCategory=$('category-filter').value; const categories=[...new Set(state.items.filter(item=>item.active!==false).map(item=>item.category||'其他'))].sort((a,b)=>a.localeCompare(b,'zh-CN')); const category=categories.includes(selectedCategory)?selectedCategory:''; $('category-filter').innerHTML='<option value="">全部大致品类</option>'+categories.map(value=>'<option value="'+escapeHtml(value)+'">'+escapeHtml(value)+'</option>').join(''); $('category-filter').value=category; state.filtered=state.items.filter(item=>item.active!==false&&(!q||searchText(item).includes(q))&&(!category||(item.category||'其他')===category)); const pageCount=Math.max(1,Math.ceil(state.filtered.length/state.pageSize)); if(state.page>pageCount)state.page=pageCount; const start=(state.page-1)*state.pageSize; const rows=state.filtered.slice(start,start+state.pageSize); $('result-note').textContent='当前店铺：'+(state.store?.name||'')+'，找到 '+integer(state.filtered.length)+' 个商品；数据更新时间 '+(formatDate(state.store?.updatedAt)||'待抓取'); $('product-body').innerHTML=rows.length?rows.map(item=>{const p=params(item); return '<tr><td class="id">'+escapeHtml(item.id)+'</td><td>'+imageHtml(item)+'</td><td class="title">'+escapeHtml(item.title||'')+'</td><td><span class="tag" title="归类依据：'+escapeHtml(item.category_source||'商品标题')+'；置信度：'+escapeHtml(item.category_confidence||'低')+'">'+escapeHtml(item.category||'其他')+'</span></td><td class="price">'+(item.price!==null&&item.price!==undefined?'¥'+Number(item.price).toLocaleString('zh-CN',{minimumFractionDigits:2}):'<span class="pending">待抓取</span>')+'</td><td class="sales">'+escapeHtml(item.sales_display||'待抓取')+'</td><td class="param">'+valueHtml(pick(item,['品牌']),item)+'</td><td class="param">'+valueHtml(pick(item,['货号']),item)+'</td><td class="param">'+valueHtml(pick(item,['材质成分','成分含量','材质','面料']),item)+'</td><td class="param">'+valueHtml(pick(item,['上市年份季节','上市年份','上市时间']),item)+'</td><td class="param">'+valueHtml(pick(item,['适用人群','适用性别','适用对象']),item)+'</td><td class="param">'+valueHtml(pick(item,['适用场景']),item)+'</td><td class="param">'+valueHtml(pick(item,['是否商场同款']),item)+'</td><td class="param">'+valueHtml([pick(item,['版型','服装版型']),pick(item,['衣长类型','衣长'])].filter(Boolean).join(' / '),item)+'</td><td class="param">'+valueHtml(pick(item,['尺码','鞋码']),item)+'</td><td class="param">'+valueHtml(pick(item,['颜色','颜色分类']),item)+'</td><td>'+detailsHtml(item)+'</td><td>'+(item.url?'<a href="'+escapeHtml(item.url)+'" target="_blank" rel="noopener">查看商品</a>':'')+'</td></tr>';}).join(''):'<tr><td colspan="18" class="empty">当前店铺还没有可显示的数据，或筛选条件没有匹配结果。</td></tr>'; $('page-text').textContent='第 '+state.page+' / '+pageCount+' 页'; $('prev').disabled=state.page<=1; $('next').disabled=state.page>=pageCount; updateStats(); }
    function csvEscape(value){const text=String(value??'');return '"'+text.replace(/"/g,'""')+'"';}
    function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
    function currentCsv(){const headers=['店铺','商品ID','商品标题','大致分类','商品链接','列表价','列表销量','详情状态','详情抓取时间','品牌','货号','材质成分','上市年份季节','适用人群','适用场景','是否商场同款','版型','衣长类型','尺码','颜色','全部参数'];const rows=state.filtered.map(item=>{const p=params(item);return [state.store.name,item.id,item.title,item.category,item.url,item.price,item.sales_display,item.detail_status,item.detail_captured_at,pick(item,['品牌']),pick(item,['货号']),pick(item,['材质成分','成分含量','材质','面料']),pick(item,['上市年份季节','上市年份']),pick(item,['适用人群','适用性别']),pick(item,['适用场景']),pick(item,['是否商场同款']),pick(item,['版型']),pick(item,['衣长类型','衣长']),pick(item,['尺码','鞋码']),pick(item,['颜色','颜色分类']),allParamsText(item)];});return '\ufeff'+[headers,...rows].map(row=>row.map(csvEscape).join(',')).join('\n');}
    $('search').addEventListener('input',()=>{state.page=1;render()});$('category-filter').addEventListener('change',()=>{state.page=1;render()});$('prev').addEventListener('click',()=>{state.page-=1;render()});$('next').addEventListener('click',()=>{state.page+=1;render()});$('reset').addEventListener('click',()=>{$('search').value='';$('category-filter').value='';state.page=1;render()});$('store-select').addEventListener('change',event=>loadStore(event.target.value));$('download-csv').addEventListener('click',()=>download((state.store?.slug||'store')+'.csv',currentCsv(),'text/csv;charset=utf-8'));$('download-json').addEventListener('click',()=>download((state.store?.slug||'store')+'.json',JSON.stringify({store:state.store,items:state.items},null,2),'application/json;charset=utf-8'));$('download-index').addEventListener('click',()=>download('tmall-competitor-manifest.json',JSON.stringify(state.manifest,null,2),'application/json;charset=utf-8'));
    fetch('./manifest.json').then(response=>response.json()).then(async manifest=>{state.manifest=manifest;renderStoreControls();await loadStore(manifest.stores[0]?.slug);}).catch(error=>{$('result-note').textContent='网页数据加载失败：'+error.message;});
  </script>
</body>
</html>
